.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(6,30,74,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet img{max-width:100%;border-radius:10px;display:block;margin:8px auto}
.sheet .x{float:left}
details{border-top:1px solid var(--line);padding:10px 0} details summary{cursor:pointer;font-weight:600;min-height:32px}
table.kv{width:100%;border-collapse:collapse;font-size:14px} table.kv td{padding:5px 0;vertical-align:top;border-bottom:1px solid var(--ice2)} table.kv td:first-child{color:var(--muted);width:42%}
.center{text-align:center} .empty{text-align:center;color:var(--muted);padding:26px 10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--tq2);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.lines .ln{display:grid;grid-template-columns:1fr 64px 86px 34px;gap:6px;margin-bottom:6px}
.lines .ln button{border:0;background:var(--badbg);color:var(--bad);border-radius:10px;cursor:pointer}

<script>

const S={token:null,user:null,clients:[],cid:null,tab:'home',data:{},installEvt:null};
try{S.token=localStorage.getItem('bk_token');S.cid=localStorage.getItem('bk_cid')}catch(e){}

function h(tag,a,...kids){const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value'||k==='checked'||k==='disabled'||k==='selected')e[k]=v;else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat(Infinity)){if(c==null||c===false||c==='')continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e}
const svg=(p)=>h('span',{html:'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'}).firstChild;
const num=(x)=>h('span',{class:'n'},x);
const fmt=(n)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const money=(n,c)=>[num(fmt(n)),' ',({EGP:'ج',SAR:'ر.س',USD:'$'})[c||'EGP']||c];
const dt=(s)=>s?new Date(s).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short'}):'';
const dtt=(s)=>s?new Date(s).toLocaleString('ar-EG-u-nu-latn',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';

function toast(msg,bad){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=h('div',{class:'toast'+(bad?' bad':''),role:'status'},msg);document.body.append(t);setTimeout(()=>t.remove(),bad?5000:2600)}
async function api(action,data){
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:S.token,...(data||{})})})}
  catch(e){throw new Error('مفيش اتصال بالإنترنت، جرّب تاني')}
  let j;try{j=await r.json()}catch(e){throw new Error('حصل خطأ، جرّب تاني')}
  if(!j.ok){if(j.code==='auth'){S.token=null;store('bk_token',null);S.user=null;render()}const er=new Error(j.error||'حصل خطأ');er.code=j.code;throw er}
  return j}
async function run(btn,fn){if(btn){if(btn.disabled)return;btn.disabled=true}try{await fn()}catch(e){toast(e.message||'حصل خطأ',true)}finally{if(btn)btn.disabled=false}}
function modal(build){const m=h('div',{class:'modal',onclick:(e)=>{if(e.target===m)m.remove()}});const sh=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});
  const close=()=>m.remove();sh.append(h('button',{class:'btn ghost sm x',onclick:close},'قفل'));build(sh,close);m.append(sh);document.body.append(m);return close}
function field(label,input,req){return [h('label',null,label,req?h('i',null,' *'):null),input]}
function inp(o){return h('input',Object.assign({type:'text'},o))}
function sel(opts,val,o){return h('select',o||null,opts.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return h('option',{value:v,selected:v===val},t)}))}

/* ---------- files ---------- */
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const max=2000,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return blob&&blob.size<file.size?blob:file}catch(e){return file}}
async function upload(cid,file){
  const body=await shrink(file);const type=(body.type||file.type||'').split(';')[0];
  if(body.size>20*1024*1024)throw new Error('الملف أكبر من 20 ميجا');
  const u=await api('upload_url',{client_id:cid,content_type:type});
  const r=await fetch(u.url,{method:'PUT',headers:{'Content-Type':type},body});
  if(!r.ok)throw new Error('الرفع ما كملش، جرّب تاني');
  return u.path}
async function openFile(cid,path){

  catch(e){toast(e.message,true)}}
function filePicker(o){ // returns {el, files[]}
  const st={files:[]};const thumbs=h('div',{class:'thumbs'});
  const draw=()=>{thumbs.replaceChildren(...st.files.map((f,i)=>{const t=h('div',{class:'thumb'},f.type.startsWith('image/')?null:(f.name.split('.').pop()||'ملف').toUpperCase(),h('button',{type:'button','aria-label':'شيل الملف',onclick:()=>{st.files.splice(i,1);draw()}},'×'));

  const add=(list)=>{for(const f of list){if(st.files.length<(o.max||20))st.files.push(f)}draw();o.onchange&&o.onchange()};
  const cam=h('input',{type:'file',accept:'image/*',capture:'environment',hidden:true,onchange:e=>{add(e.target.files);e.target.value=''}});
  const pick=h('input',{type:'file',accept:o.accept||'image/*,application/pdf,.xlsx,.xls,.csv',multiple:(o.max||20)>1,hidden:true,onchange:e=>{add(e.target.files);e.target.value=''}});
  st.el=h('div',null,cam,pick,h('div',{class:'row'},h('button',{type:'button',class:'btn tq grow',onclick:()=>cam.click()},'صوّر'),h('button',{type:'button',class:'btn ghost grow',onclick:()=>pick.click()},'اختار ملف')),thumbs);

function recorder(){ // voice note
